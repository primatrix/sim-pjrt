<svg xmlns="http://www.w3.org/2000/svg" width="960" height="493" viewBox="0 0 1160 596" role="img" aria-labelledby="title desc"><title id="title">StableHLO-based TPU simulation</title><desc id="desc">JAX lowers through StableHLO and PJRT. The hardware path compiles with libtpu for TPU execution. The simulator separately compiles StableHLO with offline libtpu into Final LLO bundles and a call map. The cost model uses those artifacts, a hardware profile and execution scenario to estimate bundle issue, DMA and synchronization time. Ready joins the modeled timer with CPU output simulation and Virtual HBM.</desc><defs><marker id="a6E8295" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#6E8295" stroke-width="1.5"/></marker><marker id="aA3ADB6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#A3ADB6" stroke-width="1.5"/></marker></defs><rect width="1160" height="596" fill="#FFFFFF"/>
