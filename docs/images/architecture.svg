<svg xmlns="http://www.w3.org/2000/svg" width="960" height="352"
     viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">JAX and TorchTPU through the sim-pjrt backend</title>
  <desc id="desc">JAX with SGLang-Jax and PyTorch with vLLM-TorchTPU produce StableHLO
    for the PJRT C API. On real TPUs, libtpu compiles HLO to LLO and VLIW. The
    sim-pjrt PJRT plugin runs on the CPU host: libtpu emits Final LLO bundles for
    the cost model, while a CPU lowering and Virtual HBM keep control values with
    placeholder floats. Ready waits for both the modeled timer and the outputs.</desc>
  <style>
    /* Page colors match GitHub's README canvas; accent matches logo.svg. */
    .paper { fill: #FFFFFF; }
    .ink { fill: #1F2328; }
    .muted { fill: #59636E; }
    .accent { fill: #5B7194; }
    .box { fill: #FFFFFF; stroke: #424A53; stroke-width: 1; }
    .box-thin { fill: none; stroke: #5B7194; stroke-width: 0.75; }
    .region { fill: none; stroke: #C8D1DA; stroke-width: 1; }
    .lane { fill: none; stroke: #C8D1DA; stroke-width: 1; stroke-dasharray: 3 4; }
    .wire { fill: none; stroke: #8C959F; stroke-width: 1.1; }
    .dash { stroke-dasharray: 3 4; }
    .tip, .node { fill: #8C959F; }
    .caps { font-size: 11px; letter-spacing: 0.18em; }
    .knock { paint-order: stroke; stroke: #FFFFFF; stroke-width: 16px;
             stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #0D1117; }
      .ink { fill: #E6EDF3; }
      .muted { fill: #9198A1; }
      .accent { fill: #A3B8D8; }
      .box { fill: #0D1117; stroke: #8B949E; }
      .box-thin { stroke: #A3B8D8; }
      .region, .lane { stroke: #3D444D; }
      .wire { stroke: #6E7681; }
      .tip, .node { fill: #6E7681; }
      .knock { stroke: #0D1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4"
            markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path class="tip" d="M 0 0.8 L 8 4 L 0 7.2 Z"/>
    </marker>
  </defs>

  <rect class="paper" x="0" y="0" width="1200" height="440"/>

  <g font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', P052, Georgia, 'Times New Roman', serif"
     text-anchor="middle">

    <!-- Real TPU path -->
    <rect class="lane" x="544.5" y="44.5" width="600" height="68"/>
    <text class="muted caps knock" x="600" y="48.5">REAL TPU</text>
    <text class="ink" x="608" y="84" font-size="19" font-weight="600">libtpu</text>
    <g font-size="15" font-style="italic">
      <text class="muted" x="812" y="83">HLO</text>
      <text class="muted" x="904" y="83">LLO</text>
      <text class="muted" x="996" y="83">VLIW</text>
      <text class="ink" x="1088" y="83">TPU</text>
    </g>
    <path class="wire" d="M834 78 H880" marker-end="url(#arrow)"/>
    <path class="wire" d="M926 78 H970" marker-end="url(#arrow)"/>
    <path class="wire" d="M1024 78 H1066" marker-end="url(#arrow)"/>

    <!-- Simulator region -->
    <rect class="region" x="544.5" y="140.5" width="600" height="256"/>

    <!-- Wires (under the boxes) -->
    <path class="wire" d="M248 216 H280 V320 H248"/>
    <path class="wire" d="M280 268 H312" marker-end="url(#arrow)"/>
    <path class="wire dash" d="M392 232 V78 H544" marker-end="url(#arrow)"/>
    <path class="wire" d="M472 268 H504"/>
    <path class="wire" d="M504 268 V216 H576" marker-end="url(#arrow)"/>
    <path class="wire" d="M504 268 V320 H576" marker-end="url(#arrow)"/>
    <path class="wire" d="M752 216 H800" marker-end="url(#arrow)"/>
    <path class="wire" d="M752 320 H800" marker-end="url(#arrow)"/>
    <path class="wire" d="M976 216 H1000 V320 H976"/>
    <path class="wire" d="M1000 268 H1024" marker-end="url(#arrow)"/>
    <circle class="node" cx="280" cy="268" r="2.5"/>
    <circle class="node" cx="504" cy="268" r="2.5"/>
    <circle class="node" cx="1000" cy="268" r="2.5"/>

    <text class="muted caps knock" x="652" y="144.5">PJRT PLUGIN · CPU HOST</text>

    <!-- Frontends -->
    <rect class="box" x="56.5" y="180.5" width="191" height="71"/>
    <text class="ink" x="152" y="211" font-size="19" font-weight="600">JAX</text>
    <text class="muted" x="152" y="235" font-size="14.5" font-style="italic">SGLang-Jax</text>
    <rect class="box" x="56.5" y="284.5" width="191" height="71"/>
    <text class="ink" x="152" y="315" font-size="19" font-weight="600">PyTorch</text>
    <text class="muted" x="152" y="339" font-size="14.5" font-style="italic">vLLM-TorchTPU</text>

    <!-- Shared interface -->
    <rect class="box" x="312.5" y="232.5" width="159" height="71"/>
    <text class="ink" x="392" y="263" font-size="19" font-weight="600">StableHLO</text>
    <text class="muted" x="392" y="287" font-size="14.5" font-style="italic">PJRT C API</text>

    <!-- Timing track -->
    <rect class="box" x="576.5" y="180.5" width="175" height="71"/>
    <text class="ink" x="664" y="211" font-size="19" font-weight="600">libtpu</text>
    <text class="muted" x="664" y="235" font-size="14.5" font-style="italic">Final LLO bundles</text>
    <rect class="box" x="800.5" y="180.5" width="175" height="71"/>
    <text class="ink" x="888" y="211" font-size="19" font-weight="600">Cost model</text>
    <text class="muted" x="888" y="235" font-size="14.5" font-style="italic">Issue · DMA · sync</text>

    <!-- Output track -->
    <rect class="box" x="576.5" y="284.5" width="175" height="71"/>
    <text class="ink" x="664" y="315" font-size="19" font-weight="600">CPU lowering</text>
    <text class="muted" x="664" y="339" font-size="14.5" font-style="italic">Control values</text>
    <rect class="box" x="800.5" y="284.5" width="175" height="71"/>
    <text class="ink" x="888" y="315" font-size="19" font-weight="600">Virtual HBM</text>
    <text class="muted" x="888" y="339" font-size="14.5" font-style="italic">Placeholder floats</text>

    <!-- Ready (double rule) -->
    <rect class="box" x="1024.5" y="232.5" width="95" height="71"/>
    <rect class="box-thin" x="1028.5" y="236.5" width="87" height="63"/>
    <text class="accent" x="1072" y="275" font-size="20" font-weight="600">Ready</text>
  </g>
</svg>
