<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-labelledby="title desc">
  <title id="title">sim-pjrt</title>
  <desc id="desc">A slate-blue virtual TPU drawn as a double-ruled square with pins and four compute units.</desc>
  <style>
    .mark { color: #5b7194; }
    @media (prefers-color-scheme: dark) {
      .mark { color: #a3b8d8; }
    }
  </style>
  <g class="mark" fill="none" stroke="currentColor">
    <!-- Package: heavy outer rule, hairline inner rule (matches the diagram's Ready box). -->
    <rect x="8" y="8" width="32" height="32" stroke-width="2.5"/>
    <rect x="11.5" y="11.5" width="25" height="25" stroke-width="1"/>
    <!-- Pins -->
    <path stroke-width="2" d="M19 8V3M29 8V3M19 45V40M29 45V40M8 19H3M8 29H3M45 19H40M45 29H40"/>
  </g>
  <g class="mark" fill="currentColor">
    <rect x="15.5" y="15.5" width="7" height="7"/>
    <rect x="25.5" y="15.5" width="7" height="7"/>
    <rect x="15.5" y="25.5" width="7" height="7"/>
    <rect x="25.5" y="25.5" width="7" height="7"/>
  </g>
</svg>
