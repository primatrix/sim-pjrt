name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bazel Python tests in Docker
        run: |
          export BUILD_UID=$(id -u) BUILD_GID=$(id -g)
          docker compose run --build --rm bazel test //tests/python:python_tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: HLO parser tests with native jaxlib
        run: |
          python -m pip install 'jaxlib==0.11.1'
          PYTHONPATH=python python tests/python/profile_import_test.py -v
  docs:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
      - run: npm run build
