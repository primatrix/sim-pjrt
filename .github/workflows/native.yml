name: Native build and release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make room for XLA
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h .
      # Each attempt gets a fresh snapshot, including incomplete cold builds.
      - name: Restore Bazel dependencies and compiled actions
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: .build/bazel-cache
          key: native-manylinux-2-34-x64-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock', 'third_party/**', 'docker/Dockerfile.manylinux', 'docker/bazel.sha256') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            native-manylinux-2-34-x64-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock', 'third_party/**', 'docker/Dockerfile.manylinux', 'docker/bazel.sha256') }}-
      - name: Build and validate manylinux wheel
        id: native-build
        timeout-minutes: 330
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          BUILDBUDDY_UPLOAD: 'false'
        run: |
          docker build -f docker/Dockerfile.manylinux \
            --build-arg BUILD_UID="$(id -u)" --build-arg BUILD_GID="$(id -g)" \
            -t sim-pjrt-manylinux .
          docker run --rm --init -v "$PWD:/workspace" \
            -e BUILDBUDDY_API_KEY -e BUILDBUDDY_UPLOAD sim-pjrt-manylinux
      # Ordinary build failures and step timeouts must not discard completed work.
      # Branch/tag snapshots remain subject to GitHub's cache access scope.
      - name: Save Bazel progress even when the build fails
        if: always() && !cancelled() && steps.bazel-cache.outcome == 'success' && steps.native-build.outcome != 'skipped'
        timeout-minutes: 25
        uses: actions/cache/save@v4
        with:
          path: .build/bazel-cache
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}
      - name: Checksum artifacts
        working-directory: dist
        run: sha256sum *.whl > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: manylinux-2-34-x86_64-wheel
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release version
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          tag = os.environ['GITHUB_REF_NAME']
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag} does not match package version {version}')
          PY
      - name: Download validated main build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          commit=$(git rev-parse HEAD)
          run_id=$(gh run list --workflow native.yml --branch main \
            --commit "$commit" --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful main build for $commit. Wait for that build to pass, then rerun this release."
            exit 1
          fi
          gh run download "$run_id" --name manylinux-2-34-x86_64-wheel --dir dist
      - name: Verify release wheel
        run: |
          (cd dist && sha256sum --check --strict SHA256SUMS)
          python - <<'PYCODE'
          import tomllib, zipfile
          from email.parser import Parser
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          wheels = list(Path('dist').glob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit('Expected exactly one release wheel')
          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata, = (name for name in wheel.namelist() if name.endswith('.dist-info/METADATA'))
              package = Parser().parsestr(wheel.read(metadata).decode())
          if package['Name'] != 'sim-pjrt' or package['Version'] != version:
              raise SystemExit('Wheel metadata does not match the release package/version')
          PYCODE
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* || "$RELEASE_TAG" =~ (a|b|rc|dev)[0-9] ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --generate-notes "${flags[@]}"
