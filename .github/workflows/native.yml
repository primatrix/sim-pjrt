name: Native build and tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  native:
    runs-on: [self-hosted, linux, x64, sim-pjrt]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          export BUILD_UID=$(id -u) BUILD_GID=$(id -g)
          docker compose run --build --rm bazel test //... --jobs=8
