[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-pjrt"
version = "0.1.1"
description = "Run JAX workloads with a simulated TPU PJRT backend on CPU"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
# The execution cost table is pinned to libtpu 0.0.48; see docs/dependencies.md.
dependencies = ["jax==0.11.1", "jaxlib==0.11.1", "libtpu==0.0.48", "requests"]

[project.optional-dependencies]
collect = ["xprof==2.23.1", "protobuf>=6.32.1"]

[project.scripts]
sim-pjrt = "sim_pjrt.cli:main"
spjrt = "sim_pjrt.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}
py-modules = ["bundle_timing", "profile_report"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["sim_pjrt*"]
