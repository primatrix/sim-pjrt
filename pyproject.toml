[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-pjrt"
version = "0.1.0"
description = "Run JAX workloads with a simulated TPU PJRT backend on CPU"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
# Follow SGLang-Jax's TPU extra; see docs/dependencies.md for the upstream revision.
dependencies = ["jax[tpu]==0.11.1"]

[project.scripts]
sim-pjrt = "sim_pjrt.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["sim_pjrt"]
py-modules = ["bundle_timing", "profile_report", "profile_metadata", "sparsecore", "llo_scalar"]
